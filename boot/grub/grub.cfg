# ==============================================================================
# MVentX Primary GRUB 2 Configuration
# Location: (MVX_BOOT)/boot/grub/grub.cfg
#
# This file is loaded first upon UEFI/BIOS hand-off. It initializes display
# modules, locates the MVX_DATA partition, sets the theme, and sources the
# dynamic menu configuration (mventx_menu.cfg) generated by the manager.
# ==============================================================================

set default=0
set timeout=10

# Load essential GRUB modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod exfat
insmod ext2
insmod ntfs
insmod iso9660
insmod loopback
insmod search
insmod test
insmod echo
insmod font
insmod gfxterm
insmod gfxmenu

# Configure graphical terminal
set gfxmode=auto
terminal_output gfxterm

# Locate MVentX partitions
# Look for data partition holding ISOs and configuration
search --no-floppy --set=mventx_data_dev --label MVX_DATA

# Optional graphical theme integration
if [ -f ($root)/boot/grub/themes/mventx/theme.txt ]; then
    set theme=($root)/boot/grub/themes/mventx/theme.txt
fi

# Source dynamically generated user environments menu
if [ -f ($root)/boot/grub/mventx_menu.cfg ]; then
    configfile ($root)/boot/grub/mventx_menu.cfg
else
    menuentry "MVentX Recovery / Unconfigured Mode" {
        echo "No MVentX environment configuration found."
        echo "Please use MVentX Manager to configure your USB drive."
        echo "Press ESC or Enter to return."
        sleep 5
    }
fi

# Fallback utilities
submenu "MVentX System Utilities" {
    menuentry "Reboot System" {
        reboot
    }
    menuentry "Halt / Power Off System" {
        halt
    }
}

