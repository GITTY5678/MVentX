# ==============================================================================
# MVentX Primary Bootloader Configuration
# Location: /boot/grub/grub.cfg
#
# MVentX (Multi-Environment Boot Experience) - Milestone 1 UEFI + GRUB Prototype
# Loads display modules, sets branding, searches for mventx_menu.cfg, and
# delegates execution to the generated environment menu.
# ==============================================================================

# Default timeout in seconds
set default=0
set timeout=10

# Load essential filesystem, partition, and core GRUB modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod exfat
insmod ext2
insmod ntfs
insmod loopback
insmod iso9660
insmod linux
insmod search
insmod test
insmod echo
insmod sleep

# Terminal and display configuration
if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
fi

insmod font

# Prefer gfxterm with loaded font; fallback cleanly to UEFI console
if loadfont ($root)/boot/grub/fonts/unicode.pf2; then
    set gfxmode=auto
    insmod gfxterm
    terminal_output gfxterm
elif loadfont ($root)/boot/grub/fonts/ascii.pf2; then
    set gfxmode=auto
    insmod gfxterm
    terminal_output gfxterm
elif loadfont /boot/grub/fonts/ascii.pf2; then
    set gfxmode=auto
    insmod gfxterm
    terminal_output gfxterm
else
    terminal_output console
fi

# MVentX Brand Palette
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan
set color_normal=light-gray/black
set color_highlight=black/light-cyan

# Optional GRUB theme integration
if [ -f ($root)/boot/grub/themes/mventx/theme.txt ]; then
    insmod gfxmenu
    set theme=($root)/boot/grub/themes/mventx/theme.txt
fi

# ==============================================================================
# Dynamic Menu Loading
# Locate mventx_menu.cfg generated by MVentX Python core engine
# ==============================================================================

set mventx_found_cfg=0

# Locate data partition if available
set mventx_data_dev=""
if search --no-floppy --label --set=mventx_data_dev MVX_DATA; then
    true
elif search --no-floppy --file --set=mventx_data_dev /config/mventx.json; then
    true
fi
export mventx_data_dev

# 1. Check current root partition
if [ -f ($root)/boot/grub/mventx_menu.cfg ]; then
    set mventx_cfg_dev=$root
    set mventx_found_cfg=1
fi

# 2. Search by file across all available drives if not found on root
if [ "${mventx_found_cfg}" = "0" ]; then
    if search --no-floppy --file --set=mventx_cfg_dev /boot/grub/mventx_menu.cfg; then
        set mventx_found_cfg=1
    fi
fi

# 3. Source the dynamic configuration if found, otherwise display fallback menu
if [ "${mventx_found_cfg}" = "1" ]; then
    configfile ($mventx_cfg_dev)/boot/grub/mventx_menu.cfg
else
    menuentry "MVentX Recovery / Unconfigured Mode" --id "mventx-unconfigured" {
        echo ""
        echo "=========================================================="
        echo "  MVentX Bootloader: Missing Menu Configuration"
        echo "=========================================================="
        echo ""
        echo "  Could not find /boot/grub/mventx_menu.cfg."
        echo "  Please use the MVentX Manager on your computer to register"
        echo "  environments and generate the boot configuration."
        echo ""
        echo "  Press Enter or ESC to return."
        sleep 5
    }
fi

# ==============================================================================
# System Utilities Submenu
# ==============================================================================

submenu "MVentX System Utilities" --id "mventx-system-utils" {
    if [ "${grub_platform}" = "efi" ]; then
        menuentry "UEFI Firmware Settings" --id "uefi-firmware" {
            fwsetup
        }
    fi

    menuentry "Reboot System" --id "system-reboot" {
        echo "Rebooting system..."
        reboot
    }

    menuentry "Halt / Power Off System" --id "system-halt" {
        echo "Powering off system..."
        halt
    }
}
